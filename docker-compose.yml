services:
  backend:
    build:
      context: ./backend
    container_name: rasa_backend
    ports:
      - "8000:8000"
    environment:
      # Connect to host's Ollama instance. If on Linux/Mac, might need `host.docker.internal` in extra_hosts
      # or just rely on docker's default network. For Windows/Mac Docker Desktop, this works out of the box.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - RASA_URL=http://rasa:5005
      # SQLite file lives inside a mounted *folder*. Mounting a single file that
      # doesn't exist yet makes Docker create a directory with that name instead.
      - DATABASE_URL=sqlite:////app/data/chatbot.db
    volumes:
      - ./backend/data:/app/data
      - ./backend/chroma_db:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rasa

  frontend:
    build:
      context: ./rasa-frontend
    container_name: rasa_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  rasa:
    image: rasa/rasa:3.6.20-full
    container_name: rasa_server
    ports:
      - "5005:5005"
    volumes:
      - ./:/app
    # A fresh clone has no trained model (models/*.tar.gz is git-ignored).
    # Train once if none exists, then serve. First start takes a few minutes.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ls models/*.tar.gz >/dev/null 2>&1 || rasa train; exec rasa run --enable-api --cors "*"
    depends_on:
      - rasa-actions

  rasa-actions:
    image: rasa/rasa-sdk:3.6.2
    container_name: rasa_actions
    ports:
      - "5055:5055"
    volumes:
      - ./actions:/app/actions
    command: start --actions actions
